<!doctype html>
<html lang="eu" class="babesten">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbentarioa</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/auth.js"></script>
    <script src="js/responsive.js" defer></script>
    <script src="js/inbentario.js" defer></script>
  </head>
  <body>
    <header>
      <a href="inbentario.html">Inbentarioa</a>
      <a data-admin href="erabiltzaileak.html">Erabiltzaileak</a>
      <a href="gelak.html">Gelak</a>
      <a href="mugimenduak.html">Mugimenduak</a>
      <a href="#" id="irten">Irten</a>
    </header>
    <div class="orri-goiburua">
      <h1>Inbentarioa</h1>
      <a class="botoia botoi-berdea" href="objektuakSortu.html"
        >+ Objektu Berria Sortu</a
      >
    </div>
    <br />
    <p id="mezuErrorea" role="alert"></p>
    <form id="bilatuForm">
      <input
        type="text"
        id="bilatu"
        placeholder="Bilatu..."
        aria-label="Bilatu"
      />
      <button type="submit">Iragazi</button>
      <button type="button" id="garbitu" class="botoi-arriskua">Garbitu</button>
    </form>
    <div
      class="scroll-edukiontzia"
      tabindex="0"
      role="region"
      aria-label="Inbentarioko objektuak"
    >
      <table>
        <thead>
          <tr>
            <th>Izena</th>
            <th>Marka</th>
            <th>Modeloa</th>
            <th>Kategoria</th>
            <th>Ezaugarriak</th>
            <th class="ekintzak-zutabea">Ekintzak</th>
          </tr>
        </thead>
        <tbody id="taulaGorputza"></tbody>
      </table>
    </div>
  </body>
</html>
