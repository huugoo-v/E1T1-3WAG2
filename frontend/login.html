<!doctype html>
<html lang="eu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saioa hasi</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="shortcut icon" href="./img/Logotipo_abstracto_de_gota_orgánica-removebg-preview.png" />
    <script src="js/login.js" defer></script>
  </head>
  <body>
    
    <p id="errorea" role="alert"></p>
    <form id="loginForm">
      <h2>Saioa hasi</h2>
      <p>
        <label for="erabiltzaile">Erabiltzailea:</label><br />
        <input
          type="text"
          name="erabiltzaile"
          id="erabiltzaile"
          autocomplete="username"
          maxlength="50"
          required
        />
      </p>
      <p>
        <label for="pasahitza">Pasahitza:</label><br />
        <input
          type="password"
          name="pasahitza"
          id="pasahitza"
          autocomplete="current-password"
          maxlength="255"
          required
        />
      </p>
      <p><button type="submit">Sartu</button></p>
    </form>
  </body>
</html>
