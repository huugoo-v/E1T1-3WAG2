<!doctype html>
<html lang="eu" class="babesten">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbentarioa - Alta</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/auth.js"></script>
    <script src="js/sortuBaliabide.js" defer></script>
  </head>
  <body>
    <header>
      <a href="inbentario.html">Inbentarioa</a>
      <a data-admin href="erabiltzaileak.html">Erabiltzaileak</a>
      <a href="gelak.html">Gelak</a>
      <a href="mugimenduak.html">Mugimenduak</a>
      <a href="#" id="irten">Irten</a>
    </header>
    <h2 id="izenburua">EKIPAMENDU BERRIA — ALTA EMAN</h2>
    <p id="mezuErrorea" role="alert"></p>
    <form id="formBaliabidea">
      <input type="hidden" name="id" id="id" />
      <p>
        <label for="etiketa">Etiketa / inbentario zenbakia (*):</label><br />
        <input
          type="text"
          name="etiketa"
          id="etiketa"
          maxlength="50"
          placeholder="G1-PCHP-15"
          autocomplete="off"
          required
        />
      </p>
      <p>
        <label for="izena">Ekipamenduaren Izena (*):</label><br />
        <input
          type="text"
          name="izena"
          id="izena"
          maxlength="150"
          placeholder="Ordenagailua"
          required
        />
      </p>
      <p>
        <label for="marka">Marka:</label><br />
        <input type="text" name="marka" id="marka" maxlength="100" placeholder="HP" />
      </p>
      <p>
        <label for="modeloa">Modeloa:</label><br />
        <input
          type="text"
          name="modeloa"
          id="modeloa"
          maxlength="100"
          placeholder="ProDesk 400 G7"
        />
      </p>
      <p>
        <label for="kategoria_id">Kategoria (*):</label><br />
        <select name="kategoria_id" id="kategoria_id" required>
          <option value="1">Mahaigaineko ekipoa</option>
          <option value="2">Portatila</option>
          <option value="3">Periferikoak</option>
          <option value="4">Beste batzuk</option>
        </select>
      </p>
      <p>
        <label for="deskribapena">Deskribapena / Ezaugarriak:</label><br />
        <textarea
          name="deskribapena"
          id="deskribapena"
          rows="3"
          maxlength="2000"
          placeholder="Core i5, 16 GB RAM, 512 GB SSD..."
        ></textarea>
      </p>
      <p>
        <label for="gela_id">Gela (*):</label><br />
        <select name="gela_id" id="gela_id" required>
          <option value="">Aukeratu gela...</option>
        </select>
        <small id="gelaOharra" class="form-oharra" hidden>
          Gela aldatzeko, erabili "Mugitu" botoia gelaren orrian.
        </small>
      </p>
      <p>
        <label for="egoera">Egoera:</label><br />
        <input
          type="text"
          name="egoera"
          id="egoera"
          maxlength="50"
          list="egoeraZerrenda"
          value="Operatiboa"
        />
        <datalist id="egoeraZerrenda">
          <option value="Operatiboa"></option>
          <option value="Konponketan"></option>
          <option value="Matxuratuta"></option>
        </datalist>
      </p>
      <p>
        <label for="erosketa_data">Erosketa-data:</label><br />
        <input type="date" name="erosketa_data" id="erosketa_data" />
      </p>
      <p>
        <a href="inbentario.html">UTZI</a><button type="submit">GORDE</button>
      </p>
    </form>
  </body>
</html>
